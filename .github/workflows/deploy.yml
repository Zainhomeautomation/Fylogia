name: Validate Fylogia and refresh news
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"
permissions:
  contents: read
concurrency:
  group: fylogia-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'Zainhomeautomation/Fylogia' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:server
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
        env:
          FYLOGIA_PAGES_RUNTIME: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failures
          path: test-results
          retention-days: 3
  refresh-news:
    if: github.repository == 'Zainhomeautomation/Fylogia' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run feeds
      - name: Commit refreshed publisher feeds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/edition.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh publisher news edition'
            git push origin HEAD:main
          fi

# Deployment is Cloudflare Pages' GitHub integration, never GitHub Pages.
# Production branch: main; build: npm run build:pages; output: dist; Node: 24.
# Four-hour refreshes use at most 186 builds in a 31-day month, leaving room under the free 500-build cap.
