<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A1018" />
    <script>
      try {
        const selected = JSON.parse(
          localStorage.getItem("folio.v1.preferences") || "null",
        )?.theme;
        const theme =
          selected === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "navy"
              : "light"
            : ["navy", "dark", "light"].includes(selected)
              ? selected
              : "navy";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = {
          navy: "#0A1018",
          dark: "#121a17",
          light: "#f8f6ef",
        }[theme];
      } catch {
        document.documentElement.dataset.theme = "navy";
      }
    </script>
    <meta
      name="description"
      content="Your World, One Page at a Time. Fylogia is your personal news and magazine reader, with real sources and a library that stays yours."
    />
    <meta name="application-name" content="Fylogia" />
    <meta name="apple-mobile-web-app-title" content="Fylogia" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link
      rel="preload"
      href="%BASE_URL%fonts/dm-sans-latin-v17.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="canonical" href="https://fylogia.com/" />
    <meta
      property="og:title"
      content="Fylogia — Your World, One Page at a Time."
    />
    <meta
      property="og:description"
      content="Your World, One Page at a Time. Personalized news, thoughtful reading, and a library that stays yours."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fylogia.com/" />
    <meta
      property="og:image"
      content="https://fylogia.com/icons/icon-512.png"
    />
    <title>Fylogia — Your World, One Page at a Time.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
